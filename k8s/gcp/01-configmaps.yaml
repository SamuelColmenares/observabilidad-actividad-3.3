# ═══════════════════════════════════════════════════════════════════════════
# k8s/gcp/01-configmaps.yaml — Configuración de Collector, Prometheus, Grafana y Apps
# ═══════════════════════════════════════════════════════════════════════════
---
# ── OTel Collector ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      resource:
        attributes:
          - action: insert
            key: deployment.environment
            value: production
          - action: insert
            key: cloud.provider
            value: gcp
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp/jaeger:
        endpoint: jaeger.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true
      googlecloud:
        project: ${env:GCP_PROJECT_ID}
        log:
          default_log_name: actividad-3-3-otel
      debug:
        verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, debug]
      # Nota: se omite 'telemetry.metrics.readers' — duplica el puerto 8888
      # que el collector ya expone por defecto y provocaba "address already in use".

---
# ── Prometheus ConfigMap (con scraping y alertas AIOps)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      - job_name: 'otel-collector-internal'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8888']

  alerts.yml: |
    groups:
      - name: aiops_anomaly_correlation_rules
        rules:
          - alert: CorrelatedErrorRateAndLatencyAnomaly
            expr: |
              (
                rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m]) 
                > 
                (
                  avg_over_time(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])[30m:1m]) 
                  + 2 * stddev_over_time(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])[30m:1m])
                )
              )
              and
              (
                histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[2m])) by (le)) > 0.200
              )
            for: 10s
            labels:
              severity: critical
              category: aiops_correlation_anomaly
              component: data-access-service
            annotations:
              summary: "Anomalía Correlacionada en DataAccess: Error Rate > baseline + 2σ Y Latencia P99 > 200ms"
              description: "Se detectó un incremento anómalo simultáneo en la tasa de error 5xx y en la latencia P99 (> 200ms SLO)."
              runbook_url: "http://jaeger.observability.svc.cluster.local:16686/search?service=data-access-service&tags=%7B%22error%22%3A%22true%22%7D"

---
# ── Grafana Datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability.svc.cluster.local:16686
        jsonData:
          spanBar:
            type: 'Tag'
            tag: 'http.status_code'

      - name: Google Cloud Logging
        uid: cloud-logging
        type: googlecloud-logging-datasource
        access: proxy
        jsonData:
          authenticationType: gce
        correlations:
          - targetUID: jaeger
            label: "Ver traza completa en Jaeger"
            description: "Abre en Jaeger la traza distribuida correspondiente al trace_id de este log"
            type: query
            config:
              field: "jsonPayload.trace_id"
              target:
                queryType: "traceID"
                query: "${__value.raw}"

---
# ── ConfigMap para Microservicios (Namespace: apps)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env-config
  namespace: apps
data:
  ENVIRONMENT: "Production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  Services__DataAccessUrl: "http://data-access.apps.svc.cluster.local:5003"
  Services__PassengersUrl: "http://passengers.apps.svc.cluster.local:5001"

