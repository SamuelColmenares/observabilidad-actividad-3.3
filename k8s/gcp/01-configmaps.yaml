# ═══════════════════════════════════════════════════════════════════════════
# k8s/gcp/01-configmaps.yaml — Configuración de Collector, Prometheus, Grafana y Apps
# ═══════════════════════════════════════════════════════════════════════════
---
# ── OTel Collector ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      resource:
        attributes:
          - action: insert
            key: deployment.environment
            value: production
          - action: insert
            key: cloud.provider
            value: gcp
      batch:
        timeout: 5s
        send_batch_size: 1024

    exporters:
      otlp/jaeger:
        endpoint: jaeger.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        enable_open_metrics: true
      googlecloud:
        project: ${env:GCP_PROJECT_ID}
        log:
          default_log_name: actividad-3-3-otel
      debug:
        verbosity: normal

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud, debug]
      # Nota: se omite 'telemetry.metrics.readers' — duplica el puerto 8888
      # que el collector ya expone por defecto y provocaba "address already in use".

---
# ── Prometheus ConfigMap (con scraping y alertas AIOps)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      - job_name: 'otel-collector-internal'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8888']

  alerts.yml: |
    groups:
      - name: aiops_anomaly_correlation_rules
        rules:
          - alert: CorrelatedErrorRateAndLatencyAnomaly
            expr: |
              (
                rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m]) 
                > 
                (
                  avg_over_time(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])[30m:1m]) 
                  + 2 * stddev_over_time(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[10m])[30m:1m])
                )
              )
              and
              (
                histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[2m])) by (le)) > 0.200
              )
            for: 10s
            labels:
              severity: critical
              category: aiops_correlation_anomaly
              component: data-access-service
            annotations:
              summary: "Anomalía Correlacionada en DataAccess: Error Rate > baseline + 2σ Y Latencia P99 > 200ms"
              description: "Se detectó un incremento anómalo simultáneo en la tasa de error 5xx y en la latencia P99 (> 200ms SLO)."
              runbook_url: "http://jaeger.observability.svc.cluster.local:16686/search?service=data-access-service&tags=%7B%22error%22%3A%22true%22%7D"

---
# ── Grafana Datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: jaeger

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability.svc.cluster.local:16686
        jsonData:
          spanBar:
            type: 'Tag'
            tag: 'http.status_code'

      - name: Google Cloud Logging
        uid: cloud-logging
        type: googlecloud-logging-datasource
        access: proxy
        jsonData:
          authenticationType: gce
        correlations:
          - targetUID: jaeger
            label: "Ver traza completa en Jaeger"
            description: "Abre en Jaeger la traza distribuida correspondiente al trace_id de este log"
            type: query
            config:
              field: "jsonPayload.trace_id"
              target:
                queryType: "traceID"
                query: "${__value.raw}"

---
# ── Grafana Dashboard Provider (habilita carga automática de dashboards)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
# ── Dashboard "Golden Signals" (Latencia P99, Error Rate, RPS)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  golden-signals.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "timeseries",
          "title": "RPS (Requests Per Second)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Error Rate (%) - HTTP 5xx",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "100 * sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[1m])) by (job) / sum(rate(http_server_request_duration_seconds_count[1m])) by (job)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latencia P99",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket[1m])) by (le, job))",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["golden-signals", "actividad-3-3"],
      "time": { "from": "now-30m", "to": "now" },
      "timezone": "browser",
      "title": "Golden Signals - Observabilidad Actividad 3.3",
      "uid": "golden-signals",
      "version": 1
    }

---
# ── ConfigMap para Microservicios (Namespace: apps)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env-config
  namespace: apps
data:
  ENVIRONMENT: "Production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  Services__DataAccessUrl: "http://data-access.apps.svc.cluster.local:5003"
  Services__PassengersUrl: "http://passengers.apps.svc.cluster.local:5001"

