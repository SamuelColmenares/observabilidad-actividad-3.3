# =============================================================================
# Checkin CI/CD — Build, Test & Deploy to Cloud Run
# =============================================================================

name: Checkin CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Checkin/**'
      - 'Checkin.Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'Checkin/**'
      - 'Checkin.Tests/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: checkin-service
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/actividad-2-2/checkin

permissions:
  contents: read
  id-token: write

jobs:
  # ── Job 1: Build & Test (CI) ────────────────────────────────────────────────
  build-and-test:
    name: Build and Test Checkin Service
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 ─────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 3. Restore dependencies ───────────────────────────────────────────────
      - name: Restore dependencies
        run: |
          dotnet restore Checkin/Checkin.csproj
          dotnet restore Checkin.Tests/Checkin.Tests.csproj

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build solution and tests
        run: |
          dotnet build Checkin/Checkin.csproj --no-restore -c Release
          dotnet build Checkin.Tests/Checkin.Tests.csproj --no-restore -c Release

      # ── 5. Run unit tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: dotnet test Checkin.Tests/Checkin.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      # ── 6. Upload test results (optional, visible in Actions UI) ─────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkin-test-results
          path: test-results/
          retention-days: 7

  # ── Job 2: Build & Push Docker Image (CD) ───────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Authenticate with GCP via Workload Identity Federation ───────────
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # ── 3. Setup gcloud CLI ────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 4. Login to Artifact Registry ─────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # ── 5. Set image tag ───────────────────────────────────────────────────
      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${{ env.IMAGE_NAME }}:${SHORT_SHA}"

      # ── 6. Build and push Docker image ─────────────────────────────────────
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.image_tag }}

          docker build \
            -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./Checkin

          docker push ${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker push ${{ env.IMAGE_NAME }}:latest

          echo "Pushed: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

  # ── Job 3: Deploy to Cloud Run (CD) ──────────────────────────────────────────
  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # ── 1. Authenticate with GCP ───────────────────────────────────────────
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # ── 2. Setup gcloud CLI ────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────
      - name: Deploy Checkin to Cloud Run
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="
              Couchbase__ConnectionString=couchbase://${{ secrets.GCE_VM_EXTERNAL_IP }},
              Couchbase__Username=${{ secrets.CB_ADMIN_USER }},
              Couchbase__Password=${{ secrets.CB_ADMIN_PASSWORD }},
              Services__PassengersUrl=${{ secrets.PASSENGERS_SERVICE_URL }},
              OpenTelemetry__OtlpEndpoint=${{ secrets.OTEL_COLLECTOR_ENDPOINT }},
              OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_COLLECTOR_ENDPOINT }}
            " \
            --quiet

      # ── 4. Print deployed service URL ─────────────────────────────────────
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Checkin service deployed: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY

      # ── 5. Smoke test ──────────────────────────────────────────────────────
      - name: Smoke test — health check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "Checking ${SERVICE_URL}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP ${HTTP_STATUS})"
          else
            echo "⚠️ Health check returned HTTP ${HTTP_STATUS} — service may still be starting"
          fi
