# =============================================================================
# DataAccess CI/CD — Build, Test & Deploy to GKE Cluster v2
# =============================================================================

name: DataAccess CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'DataAccess/**'
      - 'k8s/gcp/07-data-access.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'DataAccess/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME_V2 }}
  CLUSTER_ZONE: ${{ secrets.GKE_CLUSTER_ZONE || 'us-central1-a' }}
  SERVICE_NAME: data-access
  NAMESPACE: apps
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/actividad-3-3/data-access

permissions:
  contents: read
  id-token: write

jobs:
  # ── Job 1: Build (CI) ───────────────────────────────────────────────────────
  build-and-test:
    name: Build DataAccess Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore DataAccess/DataAccess.csproj

      - name: Build project
        run: |
          dotnet build DataAccess/DataAccess.csproj --no-restore -c Release

  # ── Job 2: Build & Push Docker Image (CD) ───────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${{ env.IMAGE_NAME }}:${SHORT_SHA}"

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.image_tag }}

          docker build \
            -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./DataAccess

          docker push ${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ── Job 3: Deploy to GKE (CD) ───────────────────────────────────────────────
  deploy-gke:
    name: Deploy DataAccess to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK + gke plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone=${{ env.CLUSTER_ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Render and Apply Kubernetes manifests
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

          sed \
            -e "s|GCP_PROJECT_ID_PLACEHOLDER|${{ env.PROJECT_ID }}|g" \
            k8s/gcp/07-data-access.yaml | kubectl apply -f -

          # Update container image to exact tag
          kubectl set image deployment/data-access data-access=${{ env.IMAGE_NAME }}:${IMAGE_TAG} -n ${{ env.NAMESPACE }}

      - name: Wait for Rollout
        run: |
          echo "Waiting for data-access deployment rollout..."
          kubectl rollout status deployment/data-access \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s || true
          
          # Debugging: mostrar estado de pods
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=data-access
          
          echo "=== Pod Details ==="
          kubectl describe pods -n ${{ env.NAMESPACE }} -l app=data-access
          
          echo "=== Pod Logs (últimas líneas) ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app=data-access --tail=20 || echo "No logs available"
          
          echo "=== Deployment Events ==="
          kubectl describe deployment data-access -n ${{ env.NAMESPACE }}

      - name: Verify Internal Service
        run: |
          kubectl get svc data-access -n ${{ env.NAMESPACE }}
