# =============================================================================
# Prerequisites Workflow — Deploy Infrastructure to GKE (Cluster v2)
#
# Elimina la VM de GCE y Couchbase.
# Despliega en GKE: Namespaces, Secrets, ConfigMaps.
# Aprovisiona Cloud SQL (PostgreSQL) y el Service Account con Workload Identity
# usado por el sidecar Cloud SQL Auth Proxy de DataAccess.
# =============================================================================

name: Deploy Infrastructure Prerequisites to GKE

on:
  push:
    branches: [main]
    paths:
      - 'k8s/gcp/00-namespace.yaml'
      - 'k8s/gcp/01-configmaps.yaml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME_V2 }}
  CLUSTER_ZONE: ${{ secrets.GKE_CLUSTER_ZONE || 'us-central1-a' }}
  CLOUD_SQL_INSTANCE_NAME: observability-lab-pg
  CLOUD_SQL_REGION: us-central1
  DATA_ACCESS_GSA_NAME: data-access-sa

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infra-gke:
    name: Deploy Core Infrastructure & PostgreSQL to GKE
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Authenticate with GCP via Workload Identity Federation ───────────
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      # ── 3. Setup gcloud CLI + gke plugin ────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      # ── 4. Fetch cluster credentials for kubectl ─────────────────────────────
      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --zone=${{ env.CLUSTER_ZONE }} \
            --project=${{ env.PROJECT_ID }}

      # ── 5. Apply Namespaces ──────────────────────────────────────────────────
      - name: Apply Namespaces (apps & observability)
        run: |
          kubectl apply -f k8s/gcp/00-namespace.yaml

      # ── 6. Create or Update App Secrets (idempotente) ───────────────────────
      - name: Create or Update App Secrets
        run: |
          kubectl create secret generic app-secrets \
            --namespace=apps \
            --from-literal=POSTGRES_USER='${{ secrets.POSTGRES_USER || 'postgres' }}' \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD || 'postgres' }}' \
            --from-literal=POSTGRES_DB='${{ secrets.POSTGRES_DB || 'observability_db' }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      # ── 7. Render & Apply ConfigMaps ─────────────────────────────────────────
      - name: Render and Apply ConfigMaps
        run: |
          sed -e "s/GCP_PROJECT_ID_PLACEHOLDER/${{ env.PROJECT_ID }}/g" \
            k8s/gcp/01-configmaps.yaml | kubectl apply -f -

      # ── 8. Provision Cloud SQL instance, database and user (idempotente) ────
      - name: Ensure Cloud SQL instance, database & user
        env:
          # La API de Cloud SQL Admin rechaza el token WIF directo; forzar
          # impersonación real (self-impersonation) vía IAM Credentials API.
          CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          INSTANCE="${{ env.CLOUD_SQL_INSTANCE_NAME }}"

          gcloud sql instances describe "$INSTANCE" --project=${{ env.PROJECT_ID }} > /dev/null 2>&1 || \
          gcloud sql instances create "$INSTANCE" \
            --project=${{ env.PROJECT_ID }} \
            --database-version=POSTGRES_16 \
            --region=${{ env.CLOUD_SQL_REGION }} \
            --edition=ENTERPRISE \
            --tier=db-f1-micro \
            --storage-size=10GB \
            --storage-type=HDD \
            --root-password='${{ secrets.POSTGRES_PASSWORD || 'postgres' }}'

          gcloud sql databases describe '${{ secrets.POSTGRES_DB || 'observability_db' }}' \
            --instance="$INSTANCE" --project=${{ env.PROJECT_ID }} > /dev/null 2>&1 || \
          gcloud sql databases create '${{ secrets.POSTGRES_DB || 'observability_db' }}' \
            --instance="$INSTANCE" --project=${{ env.PROJECT_ID }}

          gcloud sql users set-password postgres \
            --instance="$INSTANCE" \
            --project=${{ env.PROJECT_ID }} \
            --password='${{ secrets.POSTGRES_PASSWORD || 'postgres' }}'

      # ── 9. Ensure DataAccess GCP Service Account + Workload Identity binding ─
      - name: Ensure DataAccess Cloud SQL service account
        run: |
          GSA_EMAIL="${{ env.DATA_ACCESS_GSA_NAME }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          gcloud iam service-accounts describe "$GSA_EMAIL" \
            --project=${{ env.PROJECT_ID }} > /dev/null 2>&1 || \
          gcloud iam service-accounts create ${{ env.DATA_ACCESS_GSA_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --display-name="DataAccess Cloud SQL client"

          gcloud projects add-iam-policy-binding ${{ env.PROJECT_ID }} \
            --member="serviceAccount:${GSA_EMAIL}" \
            --role="roles/cloudsql.client" \
            --condition=None

          gcloud iam service-accounts add-iam-policy-binding "$GSA_EMAIL" \
            --project=${{ env.PROJECT_ID }} \
            --role="roles/iam.workloadIdentityUser" \
            --member="serviceAccount:${{ env.PROJECT_ID }}.svc.id.goog[apps/data-access-ksa]"

      # ── 10. Verification ──────────────────────────────────────────────────────
      - name: Verify Core Infrastructure Status
        run: |
          echo "=== Namespaces ==="
          kubectl get namespaces
          echo ""
          echo "=== Cloud SQL instances ==="
          gcloud sql instances list --project=${{ env.PROJECT_ID }}
          echo ""
          echo "=== Pods in apps namespace ==="
          kubectl get pods -n apps -o wide
